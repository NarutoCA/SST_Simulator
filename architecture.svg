<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 940" width="1340" height="940" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1340" height="940" rx="14" fill="#0b0d13"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#46536f"/></marker>
</defs>
<circle cx="38" cy="40" r="5" fill="#49d6a0"/>
<text x="54" y="46" font-size="21" font-weight="800" fill="#e7ecf7" letter-spacing="3">WALLY</text>
<text x="152" y="46" font-size="13" fill="#8a94ad">architecture — security system simulator</text>
<text x="1310" y="40" font-size="10.5" fill="#5d6680" text-anchor="end">one HTML file · no build step</text>
<text x="1310" y="56" font-size="10.5" fill="#5d6680" text-anchor="end">no runtime dependencies</text>
<line x1="30" y1="66" x2="1310" y2="66" stroke="#212839"/>
<rect x="140" y="84" width="1000" height="122" rx="12" fill="#0f1320" stroke="#212839"/>
<rect x="30" y="126.0" width="9" height="9" rx="2" fill="#7dd3fc"/>
<text x="30" y="149.0" font-size="11.5" font-weight="700" fill="#e7ecf7" letter-spacing="1.4">1 · INTERFACE</text>
<text x="30" y="167.0" font-size="10" fill="#5d6680">what you touch</text>
<rect x="162" y="114" width="180" height="62" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="162" y="114" width="3.5" height="62" rx="1.8" fill="#7dd3fc"/>
<text x="176" y="136" font-size="13" font-weight="700" fill="#e7ecf7">Device palette</text>
<text x="176" y="154" font-size="10.5" fill="#8a94ad">drag &amp; drop onto</text>
<text x="176" y="169" font-size="10.5" fill="#8a94ad">the floor plan</text>
<rect x="356" y="114" width="180" height="62" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="356" y="114" width="3.5" height="62" rx="1.8" fill="#7dd3fc"/>
<text x="370" y="136" font-size="13" font-weight="700" fill="#e7ecf7">Blueprint editor</text>
<text x="370" y="154" font-size="10.5" fill="#8a94ad">draw rooms, doors,</text>
<text x="370" y="169" font-size="10.5" fill="#8a94ad">windows, archways</text>
<rect x="550" y="114" width="180" height="62" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="550" y="114" width="3.5" height="62" rx="1.8" fill="#7dd3fc"/>
<text x="564" y="136" font-size="13" font-weight="700" fill="#e7ecf7">Inspector</text>
<text x="564" y="154" font-size="10.5" fill="#8a94ad">zone, range, aim,</text>
<text x="564" y="169" font-size="10.5" fill="#8a94ad">bypass, exit delay</text>
<rect x="744" y="114" width="180" height="62" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="744" y="114" width="3.5" height="62" rx="1.8" fill="#7dd3fc"/>
<text x="758" y="136" font-size="13" font-weight="700" fill="#e7ecf7">System controls</text>
<text x="758" y="154" font-size="10.5" fill="#8a94ad">arm home / away,</text>
<text x="758" y="169" font-size="10.5" fill="#8a94ad">disarm, coverage</text>
<rect x="938" y="114" width="180" height="62" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="938" y="114" width="3.5" height="62" rx="1.8" fill="#7dd3fc"/>
<text x="952" y="136" font-size="13" font-weight="700" fill="#e7ecf7">Scenario picker</text>
<text x="952" y="154" font-size="10.5" fill="#8a94ad">choose a run,</text>
<text x="952" y="169" font-size="10.5" fill="#8a94ad">speed, pause</text>
<line x1="330" y1="206" x2="330" y2="244" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="339" y="229.0" font-size="10" fill="#5d6680">mutate the plan</text>
<line x1="1010" y1="206" x2="1010" y2="244" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1019" y="229.0" font-size="10" fill="#5d6680">place devices</text>
<rect x="140" y="244" width="1000" height="268" rx="12" fill="#0f1320" stroke="#212839"/>
<rect x="30" y="359.0" width="9" height="9" rx="2" fill="#49d6a0"/>
<text x="30" y="382.0" font-size="11.5" font-weight="700" fill="#e7ecf7" letter-spacing="1.4">2 · MODEL</text>
<text x="30" y="400.0" font-size="10" fill="#5d6680">the only real state</text>
<rect x="162" y="282" width="250" height="176" rx="9" fill="#11202e" stroke="#2b6f93"/>
<rect x="162" y="282" width="3.5" height="176" rx="1.8" fill="#7dd3fc"/>
<text x="176" y="304" font-size="13" font-weight="700" fill="#e7ecf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PLAN</text>
<text x="176" y="322" font-size="10.5" fill="#8a94ad">the single source of truth</text>
<text x="176" y="337" font-size="10.5" fill="#8a94ad"></text>
<text x="176" y="352" font-size="10.5" fill="#8a94ad">rooms[]    rectangles</text>
<text x="176" y="367" font-size="10.5" fill="#8a94ad">doors[]    + archways</text>
<text x="176" y="382" font-size="10.5" fill="#8a94ad">windows[]</text>
<text x="176" y="397" font-size="10.5" fill="#8a94ad">scenarios?  curated, or null</text>
<line x1="416" y1="346" x2="438" y2="346" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="440" y="282" width="380" height="176" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="440" y="282" width="3.5" height="176" rx="1.8" fill="#49d6a0"/>
<text x="454" y="304" font-size="13" font-weight="700" fill="#e7ecf7">DERIVED — never hand-written</text>
<text x="456" y="328" font-size="11" font-weight="700" fill="#49d6a0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WALLS</text>
<text x="456" y="342" font-size="10" fill="#8a94ad">every room edge; a shared edge is interior</text>
<text x="456" y="360" font-size="11" font-weight="700" fill="#49d6a0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SOLIDS</text>
<text x="456" y="374" font-size="10" fill="#8a94ad">walls minus openings → blocks line of sight</text>
<text x="456" y="392" font-size="11" font-weight="700" fill="#49d6a0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ADJ</text>
<text x="456" y="406" font-size="10" fill="#8a94ad">room graph built from the doors</text>
<text x="456" y="424" font-size="11" font-weight="700" fill="#49d6a0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SCENARIOS</text>
<text x="456" y="438" font-size="10" fill="#8a94ad">curated list, or autoScenarios(), then filtered</text>
<rect x="848" y="282" width="270" height="82" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="848" y="282" width="3.5" height="82" rx="1.8" fill="#22d3ee"/>
<text x="862" y="304" font-size="13" font-weight="700" fill="#e7ecf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S.devices[]</text>
<text x="862" y="322" font-size="10.5" fill="#8a94ad">nine types from CATALOG</text>
<text x="862" y="337" font-size="10.5" fill="#8a94ad">each attached to an opening,</text>
<text x="862" y="352" font-size="10.5" fill="#8a94ad">or standing in a room</text>
<rect x="848" y="376" width="270" height="82" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="848" y="376" width="3.5" height="82" rx="1.8" fill="#49d6a0"/>
<text x="862" y="398" font-size="13" font-weight="700" fill="#e7ecf7">Geometry</text>
<text x="862" y="416" font-size="10.5" fill="#8a94ad">segHit · losClear · rayCast</text>
<text x="862" y="431" font-size="10.5" fill="#8a94ad">cones and coverage are cast</text>
<text x="862" y="446" font-size="10.5" fill="#8a94ad">against SOLIDS, not guessed</text>
<text x="162" y="484" font-size="10.5" fill="#5d6680">rebuildPlan() re-derives all of this after every edit — which is what lets you draw your own building.</text>
<rect x="1170" y="244" width="140" height="268" rx="12" fill="#0f1320" stroke="#212839"/>
<rect x="1184" y="322" width="112" height="112" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="1184" y="322" width="3.5" height="112" rx="1.8" fill="#8a94ad"/>
<text x="1196" y="344" font-size="11.5" font-weight="700" fill="#e7ecf7">localStorage</text>
<text x="1196" y="360" font-size="9.5" fill="#5d6680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">save() / load()</text>
<text x="1196" y="382" font-size="10" fill="#8a94ad">the plan you drew</text>
<text x="1196" y="397" font-size="10" fill="#8a94ad">the devices</text>
<text x="1196" y="412" font-size="10" fill="#8a94ad">entry / exit delays</text>
<line x1="1142" y1="378" x2="1182" y2="378" stroke="#46536f" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line x1="640" y1="512" x2="640" y2="550" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="649" y="535.0" font-size="10" fill="#5d6680">geometry · room graph · valid scenarios</text>
<rect x="140" y="550" width="1000" height="176" rx="12" fill="#0f1320" stroke="#212839"/>
<rect x="30" y="619.0" width="9" height="9" rx="2" fill="#f5b73d"/>
<text x="30" y="642.0" font-size="11.5" font-weight="700" fill="#e7ecf7" letter-spacing="1.4">3 · SIMULATION</text>
<text x="30" y="660.0" font-size="10" fill="#5d6680">one rAF loop</text>
<rect x="162" y="584" width="220" height="92" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="162" y="584" width="3.5" height="92" rx="1.8" fill="#f5b73d"/>
<text x="176" y="606" font-size="13" font-weight="700" fill="#e7ecf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">runSim()</text>
<text x="176" y="624" font-size="10.5" fill="#8a94ad">validates the scenario,</text>
<text x="176" y="639" font-size="10.5" fill="#8a94ad">then spawns actors</text>
<text x="176" y="654" font-size="10.5" fill="#8a94ad">or starts a fire</text>
<rect x="404" y="584" width="240" height="92" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="404" y="584" width="3.5" height="92" rx="1.8" fill="#f5b73d"/>
<text x="418" y="606" font-size="13" font-weight="700" fill="#e7ecf7">Actors</text>
<text x="418" y="624" font-size="10.5" fill="#8a94ad">bfs() room to room,</text>
<text x="418" y="639" font-size="10.5" fill="#8a94ad">open doors on their route,</text>
<text x="418" y="654" font-size="10.5" fill="#8a94ad">smash glass on the way in</text>
<rect x="666" y="584" width="230" height="92" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="666" y="584" width="3.5" height="92" rx="1.8" fill="#f5b73d"/>
<text x="680" y="606" font-size="13" font-weight="700" fill="#e7ecf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sensorsTick()</text>
<text x="680" y="624" font-size="10.5" fill="#8a94ad">per device: can it see,</text>
<text x="680" y="639" font-size="10.5" fill="#8a94ad">hear or feel anything</text>
<text x="680" y="654" font-size="10.5" fill="#8a94ad">this frame?</text>
<rect x="918" y="584" width="200" height="92" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="918" y="584" width="3.5" height="92" rx="1.8" fill="#f5b73d"/>
<text x="932" y="606" font-size="13" font-weight="700" fill="#e7ecf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">onTrip()</text>
<text x="932" y="624" font-size="10.5" fill="#8a94ad">perimeter · entry/exit</text>
<text x="932" y="639" font-size="10.5" fill="#8a94ad">follower · 24-hour</text>
<text x="932" y="654" font-size="10.5" fill="#8a94ad">→ countdown or ALARM</text>
<line x1="384" y1="630" x2="402" y2="630" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="646" y1="630" x2="664" y2="630" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="898" y1="630" x2="916" y2="630" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="162" y="702" font-size="10.5" fill="#5d6680">loop(): advance openings → step actors → tick sensors → run entry/exit countdowns → draw. Pause and 1×/2×/4× just scale dt.</text>
<line x1="640" y1="726" x2="640" y2="764" stroke="#46536f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="649" y="749.0" font-size="10" fill="#5d6680">what you see and hear</text>
<rect x="140" y="764" width="1000" height="140" rx="12" fill="#0f1320" stroke="#212839"/>
<rect x="30" y="815.0" width="9" height="9" rx="2" fill="#c084fc"/>
<text x="30" y="838.0" font-size="11.5" font-weight="700" fill="#e7ecf7" letter-spacing="1.4">4 · OUTPUT</text>
<text x="30" y="856.0" font-size="10" fill="#5d6680">feedback + verdict</text>
<rect x="162" y="794" width="180" height="86" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="162" y="794" width="3.5" height="86" rx="1.8" fill="#c084fc"/>
<text x="176" y="816" font-size="13" font-weight="700" fill="#e7ecf7">Canvas</text>
<text x="176" y="834" font-size="10.5" fill="#8a94ad">floor plan, cones,</text>
<text x="176" y="849" font-size="10.5" fill="#8a94ad">actors, strobe</text>
<rect x="356" y="794" width="180" height="86" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="356" y="794" width="3.5" height="86" rx="1.8" fill="#c084fc"/>
<text x="370" y="816" font-size="13" font-weight="700" fill="#e7ecf7">Zone panel</text>
<text x="370" y="834" font-size="10.5" fill="#8a94ad">a live LED per</text>
<text x="370" y="849" font-size="10.5" fill="#8a94ad">sensor, dimmed if</text>
<text x="370" y="864" font-size="10.5" fill="#8a94ad">the zone is off</text>
<rect x="550" y="794" width="180" height="86" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="550" y="794" width="3.5" height="86" rx="1.8" fill="#c084fc"/>
<text x="564" y="816" font-size="13" font-weight="700" fill="#e7ecf7">Event log</text>
<text x="564" y="834" font-size="10.5" fill="#8a94ad">timestamped, and</text>
<text x="564" y="849" font-size="10.5" fill="#8a94ad">colour-coded by</text>
<text x="564" y="864" font-size="10.5" fill="#8a94ad">severity</text>
<rect x="744" y="794" width="180" height="86" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="744" y="794" width="3.5" height="86" rx="1.8" fill="#c084fc"/>
<text x="758" y="816" font-size="13" font-weight="700" fill="#e7ecf7">WebAudio</text>
<text x="758" y="834" font-size="10.5" fill="#8a94ad">siren, entry beeps,</text>
<text x="758" y="849" font-size="10.5" fill="#8a94ad">door chime</text>
<rect x="938" y="794" width="180" height="86" rx="9" fill="#171d2c" stroke="#2c3550"/>
<rect x="938" y="794" width="3.5" height="86" rx="1.8" fill="#c084fc"/>
<text x="952" y="816" font-size="13" font-weight="700" fill="#e7ecf7">Scored report</text>
<text x="952" y="834" font-size="10.5" fill="#8a94ad">time to detect,</text>
<text x="952" y="849" font-size="10.5" fill="#8a94ad">to alarm, coverage,</text>
<text x="952" y="864" font-size="10.5" fill="#8a94ad">cost, and advice</text>
<text x="30" y="922" font-size="10" fill="#5d6680">wally.html — ~2,750 lines in a single document. The numbered sections in the source map onto the boxes above.</text>
</svg>